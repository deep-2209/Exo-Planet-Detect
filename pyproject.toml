[project]
name = "exo-detect"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.117",
    "lightkurve>=2.6.0",
    "pandas>=2.3.3",
    "sagemaker<3",
    "scikit-learn>=1.9.0",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
